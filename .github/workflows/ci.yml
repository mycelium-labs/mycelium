name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  version-hygiene:
    # Docs churn must not move the version line (#71).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: No shields.io &release= pins in READMEs
        run: |
          set -euo pipefail
          if grep -nE 'shields\.io/pypi/v/mycelium-runtime\.svg\?[^\)]*release=' README.md sdk/README.md; then
            echo "::error::Do not pin PyPI badge cache with &release= — badges track PyPI (see sdk/docs/RELEASE.md § Version-line hygiene)."
            exit 1
          fi

      - name: No hardcoded current-version banners in READMEs
        run: |
          set -euo pipefail
          # Forbid "API-stable (**vX.Y.Z**)" / "`mycelium-runtime` **vX.Y.Z**" current banners.
          # Historical "shipped in vX.Y.Z" elsewhere is fine.
          if grep -nE 'API-stable \(\*\*v[0-9]|as `mycelium-runtime` \*\*v[0-9]' README.md sdk/README.md; then
            echo "::error::Do not hardcode the current package version in README banners — link to PyPI instead (#71)."
            exit 1
          fi

      - name: pyproject bump requires matching CHANGELOG header
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          if ! git diff --name-only "$BASE"...HEAD | grep -qx 'sdk/pyproject.toml'; then
            echo "sdk/pyproject.toml unchanged — ok"
            exit 0
          fi
          if ! git diff "$BASE"...HEAD -- sdk/pyproject.toml | grep -qE '^\+version[[:space:]]*='; then
            echo "pyproject.toml touched but version line unchanged — ok"
            exit 0
          fi
          NEW="$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' sdk/pyproject.toml | head -1)"
          if [ -z "$NEW" ]; then
            echo "::error::could not parse version from sdk/pyproject.toml"
            exit 1
          fi
          echo "Detected version bump to ${NEW}"
          if ! grep -nE "^## ${NEW}( |$)" CHANGELOG.md; then
            echo "::error::sdk/pyproject.toml version is ${NEW} but CHANGELOG.md has no '## ${NEW}' header. Version bumps belong in a release PR with a matching CHANGELOG section."
            exit 1
          fi

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build wheel and sdist
        run: |
          pip install build
          python -m build sdk

      - name: Inspect distribution skill payloads
        run: >-
          python .github/scripts/check-distribution-contents.py
          sdk/dist/*.whl sdk/dist/*.tar.gz

      - name: Save distributions for supported-Python install tests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mycelium-distributions
          path: sdk/dist/*

  package-install:
    needs: package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mycelium-distributions
          path: dist

      - name: Install and verify wheel and sdist
        run: |
          set -euo pipefail
          index=0
          for artifact in dist/*.whl dist/*.tar.gz; do
            index=$((index + 1))
            environment="${RUNNER_TEMP}/mycelium-dist-${index}"
            python -m venv "${environment}"
            "${environment}/bin/pip" install "${artifact}"
            "${environment}/bin/python" .github/scripts/test-installed-skill.py
          done

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mycelium
          POSTGRES_PASSWORD: mycelium
          POSTGRES_DB: mycelium_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mycelium -d mycelium_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      MYCELIUM_TEST_REDIS_URL: redis://127.0.0.1:6379/15
      MYCELIUM_TEST_POSTGRES_DSN: postgresql://mycelium:mycelium@127.0.0.1:5432/mycelium_test
      MYCELIUM_CI_REQUIRE_REDIS: "1"
      MYCELIUM_CI_REQUIRE_POSTGRES: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install SDK
        # redis + postgres extras so real-backend proofs import the drivers.
        run: pip install -e "./sdk[dev,redis,postgres]"

      - name: SDK unit tests
        if: matrix.python-version != '3.12'
        working-directory: sdk
        # Full suite already exercises Redis/Postgres under REQUIRE_*=1.
        run: pytest tests/ -v

      - name: SDK unit tests with coverage gate
        if: matrix.python-version == '3.12'
        working-directory: sdk
        # Full suite already exercises Redis/Postgres under REQUIRE_*=1.
        # Run coverage measurement and enforce fail-under gate on primary Python 3.12.
        run: pytest tests/ -v --cov=mycelium --cov-report=term-missing

      - name: Output coverage report to job summary
        if: always() && matrix.python-version == '3.12'
        working-directory: sdk
        run: |
          if [ -f .coverage ]; then
            echo "### Python 3.12 Test Coverage Report" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            python -m coverage report >> $GITHUB_STEP_SUMMARY 2>&1 || true
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Concurrency proofs must not skip
        working-directory: sdk
        # Explicit gate for the flagship at-most-once story (#69).
        # Focused re-run of concurrency proofs only (not Postgres identity
        # tests — those already ran above and share durable state).
        run: >
          pytest
          tests/test_proof_two_worker_redis.py
          tests/test_multiprocess_concurrency.py
          tests/test_process_kill_crash_window.py
          tests/test_example_langgraph_redis_crash.py
          -v --tb=short

      - name: Ruff
        working-directory: sdk
        run: ruff check mycelium tests

      - name: Bandit static security scanner
        if: matrix.python-version == '3.12'
        working-directory: sdk
        run: bandit -c pyproject.toml -r mycelium

  markdown-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check Markdown links and heading anchors
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --offline
            --exclude-path graphify-out
            --exclude-path .cache
            "**/*.md"
          fail: true
