# Tags + GitHub Release when sdk/pyproject.toml version is new on main.
# Cadence policy (batch; calm over velocity): sdk/docs/RELEASE.md
# — do not bump the version on every merge; accumulate, then cut one release.
name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      setup_branch_protection:
        description: Configure branch protection on main
        type: boolean
        default: false
        required: false

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' &&
       github.event.inputs.setup_branch_protection != 'true')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve and verify release source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          echo "sha=${SOURCE_SHA}" >> "$GITHUB_OUTPUT"
          SUCCESSFUL_PUSH_RUNS=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=${SOURCE_SHA}&status=completed&per_page=100" \
            --jq '[.workflow_runs[] | select(.event == "push" and .conclusion == "success")] | length')
          if [ "$SUCCESSFUL_PUSH_RUNS" -lt 1 ]; then
            echo "::error::No successful push-triggered CI run found for ${SOURCE_SHA}."
            echo "::error::Refusing to create a release tag for an unverified commit."
            exit 1
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Read version and check tag
        id: check
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('sdk/pyproject.toml','rb'))['project']['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          git fetch --tags
          if git tag -l "v$VERSION" | grep -q .; then
            echo "Tag v$VERSION already exists — nothing to release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check package version consistency
        if: steps.check.outputs.should_release == 'true'
        run: |
          set -euo pipefail
          VERSION="${{ steps.check.outputs.version }}"
          LOCK_VERSION=$(python - <<'PY'
          import tomllib

          with open("sdk/uv.lock", "rb") as handle:
              packages = tomllib.load(handle)["package"]
          matches = [
              package["version"]
              for package in packages
              if package.get("name") == "mycelium-runtime"
              and package.get("source", {}).get("editable") == "."
          ]
          if len(matches) != 1:
              raise SystemExit(
                  f"expected one editable mycelium-runtime entry in sdk/uv.lock, found {len(matches)}"
              )
          print(matches[0])
          PY
          )
          if [ "$LOCK_VERSION" != "$VERSION" ]; then
            echo "::error::sdk/pyproject.toml is ${VERSION}, but sdk/uv.lock is ${LOCK_VERSION}."
            exit 1
          fi
          if ! grep -qE "^## ${VERSION}( |$)" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no matching '## ${VERSION}' section."
            exit 1
          fi

      - name: Extract changelog section
        if: steps.check.outputs.should_release == 'true'
        run: |
          python3 .github/scripts/extract-changelog.py \
            "${{ steps.check.outputs.version }}" > /tmp/release-notes.md

      - name: Create tag, push, and create GitHub Release
        if: steps.check.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          if [ -z "$RELEASE_PAT" ]; then
            echo "::error::RELEASE_PAT secret is not set."
            echo "::error::"
            echo "::error::The tag push needs a PAT so publish.yml's on: push: tags: v* trigger fires."
            echo "::error::(GITHUB_TOKEN cannot trigger other workflows.)"
            echo "::error::"
            echo "::error::1. Create a PAT at https://github.com/settings/tokens/new"
            echo "::error::   (permissions: contents: write, on this repo only)"
            echo "::error::2. Add it as a repository secret named RELEASE_PAT at"
            echo "::error::   Settings → Secrets and variables → Actions"
            exit 1
          fi
          VERSION="${{ steps.check.outputs.version }}"
          REMOTE="https://x-access-token:${RELEASE_PAT}@github.com/${{ github.repository }}.git"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Re-check remote: a human may have tagged between the earlier check
          # and this step (race). Idempotent — succeed if tag/release already exist.
          git fetch --tags "$REMOTE"
          if git ls-remote --tags "$REMOTE" "refs/tags/v${VERSION}" | grep -q .; then
            echo "Tag v${VERSION} already on remote — skipping tag push."
          else
            git tag -a "v${VERSION}" -m "v${VERSION}" "${{ steps.source.outputs.sha }}"
            git push "$REMOTE" "v${VERSION}"
          fi

          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "GitHub Release v${VERSION} already exists — skipping create."
          elif [ -s /tmp/release-notes.md ]; then
            gh release create "v${VERSION}" \
              --target "${{ steps.source.outputs.sha }}" \
              --title "v${VERSION}" \
              --notes-file /tmp/release-notes.md
          else
            gh release create "v${VERSION}" \
              --target "${{ steps.source.outputs.sha }}" \
              --title "v${VERSION}" \
              --generate-notes
          fi

  configure-branch-protection:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.setup_branch_protection == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Print branch protection setup instructions
        run: |
          echo "::notice::GITHUB_TOKEN cannot configure branch protection (needs admin PAT)."
          echo "::notice::"
          echo "::notice::Configure manually in GitHub UI:"
          echo "::notice::  Settings → Branches → Add branch protection rule (main)"
          echo "::notice::  □ Require a pull request before merging"
          echo "::notice::    □ Require approvals (0) — solo maintainer: CI approval is enough"
          echo "::notice::  □ Require status checks to pass before merging"
          echo "::notice::    □ Require branches to be up to date"
          echo "::notice::    Status checks that are required:"
          echo "::notice::      - version-hygiene"
          echo "::notice::      - static"
          echo "::notice::      - compatibility (3.10)"
          echo "::notice::      - compatibility (3.11)"
          echo "::notice::      - compatibility (3.13)"
          echo "::notice::      - test"
          echo "::notice::      - package-install (3.10)"
          echo "::notice::      - package-install (3.13)"
          echo "::notice::      - markdown-links"
          echo "::notice::  □ Do NOT include administrators (keep your merge escape hatch)"