services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mycelium
      POSTGRES_USER: mycelium
      POSTGRES_PASSWORD: ${MYCELIUM_POSTGRES_PASSWORD:?set MYCELIUM_POSTGRES_PASSWORD}
    volumes:
      - mycelium-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mycelium -d mycelium"]
      interval: 2s
      timeout: 2s
      retries: 20
  sidecar-a:
    build: {context: ., dockerfile: Dockerfile.sidecar}
    environment:
      MYCELIUM_DATABASE_URL: postgresql://mycelium:${MYCELIUM_POSTGRES_PASSWORD}@postgres:5432/mycelium
      MYCELIUM_TOKEN: ${MYCELIUM_SIDECAR_TOKEN:?set MYCELIUM_SIDECAR_TOKEN}
    entrypoint: ["sh", "-c"]
    command: ["umask 077; printf '%s\\n' \"$$MYCELIUM_TOKEN\" > /tmp/token; exec mycelium sidecar serve --config /etc/mycelium/sidecar.yaml"]
    volumes: ["./deploy/sidecar.shared.yaml:/etc/mycelium/sidecar.yaml:ro"]
    ports: ["8787:8787"]
    depends_on: {postgres: {condition: service_healthy}}
  sidecar-b:
    build: {context: ., dockerfile: Dockerfile.sidecar}
    environment:
      MYCELIUM_DATABASE_URL: postgresql://mycelium:${MYCELIUM_POSTGRES_PASSWORD}@postgres:5432/mycelium
      MYCELIUM_TOKEN: ${MYCELIUM_SIDECAR_TOKEN:?set MYCELIUM_SIDECAR_TOKEN}
    entrypoint: ["sh", "-c"]
    command: ["umask 077; printf '%s\\n' \"$$MYCELIUM_TOKEN\" > /tmp/token; exec mycelium sidecar serve --config /etc/mycelium/sidecar.yaml"]
    volumes: ["./deploy/sidecar.shared.yaml:/etc/mycelium/sidecar.yaml:ro"]
    ports: ["8788:8787"]
    depends_on: {postgres: {condition: service_healthy}}
volumes:
  mycelium-postgres:
