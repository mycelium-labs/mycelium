[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mycelium-runtime"
version = "1.38.1"
description = "The reliability layer for AI agents — prove run-or-not and enforce at-most-once at the tool boundary"
authors = [
  { name = "Nandana Dileep" },
]
maintainers = [
  { name = "Nandana Dileep" },
]
keywords = [
  "ai-agents",
  "agent-reliability",
  "langgraph",
  "crewai",
  "idempotency",
  "tool-calling",
  "duplicate-tool-execution",
  "agent-guardrails",
  "llm-agents",
  "python",
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2,<3",
    "pyyaml>=6",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/mycelium-labs/mycelium"
Repository = "https://github.com/mycelium-labs/mycelium"
Issues = "https://github.com/mycelium-labs/mycelium/issues"

[project.optional-dependencies]
redis = ["redis>=5"]
postgres = ["psycopg[binary,pool]>=3"]
opentelemetry = ["opentelemetry-api>=1.20"]
prometheus = ["prometheus-client>=0.17"]
observability = ["opentelemetry-api>=1.20", "prometheus-client>=0.17"]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "pyright>=1.1.350",
    "fakeredis",
    "hypothesis",
    "langgraph>=1.2.9",
]
langgraph = [
    "langgraph>=1.2.9",
]
crewai = [
    "crewai>=1.15.18,<2",
]

[project.scripts]
mycelium = "mycelium.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["mycelium"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyright]
include = [
    "mycelium/__init__.py",
    "mycelium/api_stability.py",
    "mycelium/audit_receipt.py",
    "mycelium/authority_window.py",
    "mycelium/budget_llm.py",
    "mycelium/cache.py",
    "mycelium/cli_migrations.py",
    "mycelium/cli_transitions.py",
    "mycelium/completion_contract.py",
    "mycelium/config_artifacts.py",
    "mycelium/config_detect.py",
    "mycelium/config_schema.py",
    "mycelium/decision.py",
    "mycelium/entity_guard.py",
    "mycelium/history_guard.py",
    "mycelium/ledger_migrations.py",
    "mycelium/loop_guard.py",
    "mycelium/message_validator.py",
    "mycelium/operator_auth.py",
    "mycelium/provider_conformance.py",
    "mycelium/quickstart.py",
    "mycelium/reconcile.py",
    "mycelium/schema.py",
    "mycelium/scope_guard.py",
    "mycelium/secret_protection.py",
    "mycelium/session.py",
    "mycelium/state_authority.py",
    "mycelium/state_migrations.py",
    "mycelium/tool_boundary.py",
    "mycelium/tool_registry.py",
    "mycelium/tool_runner.py",
    "mycelium/transition_resolution.py",
]
pythonVersion = "3.10"
reportMissingImports = false
reportMissingTypeStubs = false

# Keep repository-development material out of source archives. The sdist still
# contains the README, build metadata, and the complete runtime package.
[tool.hatch.build.targets.sdist]
exclude = [
  ".hypothesis/",
  ".pytest_cache/",
  ".ruff_cache/",
  ".venv/",
  "dist/",
  "tests/",
  "docs/",
  "examples/",
  "scripts/",
  "api-snapshot.json",
  "uv.lock",
  "**/__pycache__/",
  "**/*.pyc",
]
