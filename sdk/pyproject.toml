[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mycelium-runtime"
version = "1.38.2"
description = "The reliability layer for AI agents — prove run-or-not and enforce at-most-once at the tool boundary"
authors = [
  { name = "Nandana Dileep" },
]
maintainers = [
  { name = "Nandana Dileep" },
]
keywords = [
  "ai-agents",
  "agent-reliability",
  "langgraph",
  "crewai",
  "idempotency",
  "tool-calling",
  "duplicate-tool-execution",
  "agent-guardrails",
  "llm-agents",
  "python",
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2,<3",
    "pyyaml>=6",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/mycelium-labs/mycelium"
Repository = "https://github.com/mycelium-labs/mycelium"
Issues = "https://github.com/mycelium-labs/mycelium/issues"

[project.optional-dependencies]
redis = ["redis>=5"]
postgres = ["psycopg[binary,pool]>=3"]
opentelemetry = ["opentelemetry-api>=1.20"]
prometheus = ["prometheus-client>=0.17"]
observability = ["opentelemetry-api>=1.20", "prometheus-client>=0.17"]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov>=5.0.0",
    "ruff",
    "fakeredis",
    "hypothesis",
    "langgraph>=1.2.9",
    "pip-audit>=2.7.3",
]
langgraph = [
    "langgraph>=1.2.9",
]
crewai = [
    "crewai>=1.15.18,<2",
]

[project.scripts]
mycelium = "mycelium.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["mycelium"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["mycelium"]
branch = true

[tool.coverage.report]
fail_under = 65
show_missing = true


[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

# Keep repository-development material out of source archives. The sdist still
# contains the README, build metadata, and the complete runtime package.
[tool.hatch.build.targets.sdist]
exclude = [
  ".coverage",
  ".coverage.*",
  "coverage.xml",
  "coverage.json",
  "coverage.lcov",
  "htmlcov/",
  ".hypothesis/",
  ".pytest_cache/",
  ".ruff_cache/",
  ".venv/",
  "dist/",
  "tests/",
  "docs/",
  "examples/",
  "scripts/",
  "api-snapshot.json",
  "uv.lock",
  ".pip-audit-ignore",
  "**/__pycache__/",
  "**/*.pyc",
]
