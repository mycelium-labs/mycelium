# Mycelium configuration (full reference template).
# IDE/agent schema: mycelium config schema -o mycelium.schema.json
# Scaffold: mycelium init --full
# On-ramp (default): mycelium init | smaller multi-guard: mycelium init --minimal
#
# Required vs optional
#   Required for transition guards:  transition, action_ledger (+ tools entries you ledger)
#   Optional:  integrations, task_ledger, state_backend, state_flush,
#              audit_receipt, outcome_emit,
#              loop_guard, completion, state_authority, registry, runner,
#              history_guard, message_validator, deployment, verify,
#              secret_args, entity_guard, destructive_confirm — delete unused sections
#
# Next steps
#   1. Allowlist first: rename tools: / tasks: stubs, then copy those exact
#      names into action_ledger.tools / task_ledger.tasks.
#      Defining a tool under tools: alone does NOT ledger it —
#      empty allowlist = no duplicate-side-effect protection.
#   2. Fill transition.agent_id / policy_version
#   3. Add callable: module:function to each configured entry, then use:
#        mycelium run --config mycelium.yaml -- python -m your_package.app
#      Or keep explicit @config.apply / @config.apply_task / config.instrument.
#
# storage (ledgers): memory | file | sqlite | redis | postgres
#   memory — tests / single-process disposable state (not production)
#   file   — local development / single host (needs path:)
#   sqlite — durable single-node default (path: + optional table)
#   redis  — multi-worker coordination (url: or url_env:)
#   postgres — durable multi-worker / audit-oriented (dsn: or dsn_env:)
# Side-effecting tools + storage: memory: set memory_storage_policy: error
#   to reject at load time (default warn keeps tests/dev working).
# Deployments: set `profile: production` so memory_storage_policy and
#   missing_run_id_policy become error automatically. Explicit `warn` under
#   production is rejected (not silently weakened).
# Stateful guards: configure one top-level state_backend (memory | file |
#   redis | postgres). Enabled loop, scope, completion, state_flush, and
#   audit_receipt sections without their own storage automatically inherit it.
#
# Tool Contracts (optional, per tool): operations/capabilities are lists;
# required_args and optional_args are identifier lists and must not overlap;
# argument_types and output_schema map fields to string, integer, number,
# boolean, array, object, or null (array/object may use a type mapping).
# A call may provide operation=... and capability=... metadata. Contracts check
# declared shape/capability only; they do not establish authorization or business intent.
# Contract validation runs after a ledger claim but before the tool body. Output
# validation never automatically retries a mutating tool.
#
# side_effect_class (per ledgered tool): read | idempotent_mutate |
#   keyed_mutate | non_idempotent_mutate | irreversible
# spendability (optional override; defaults from side_effect_class):
#   multi_use | single_use | non_replayable
#   defaults: read/idempotent_mutate → multi_use;
#             keyed/non_idempotent_mutate → single_use;
#             irreversible → non_replayable
# provider_idempotency_key_param (optional, per tool): names the kwarg that
#   carries the provider idempotency key. When set, a
#   retry_only_with_same_provider_idempotency_key retry is ALLOWED only if it
#   reuses the same key, else HARD_BLOCK. For keyed_mutate tools, when this
#   param is declared and a call omits the kwarg, Mycelium auto-injects
#   effect_id as the provider key (after ATTEMPTING decision CAS, before body).
#   Omit the param to keep the cooperative default.
#   e.g.  your_keyed_mutate_tool: {side_effect_class: keyed_mutate,
#                                  provider_idempotency_key_param: idempotency_key}
# propagate_effect_id_as_provider_key (optional bool): for non-keyed classes,
#   opt-in to the same "inject effect_id when missing" behavior. Requires
#   provider_idempotency_key_param.
# provider_idempotency_key_ttl (optional, per tool; seconds): validity window
#   for the provider idempotency key. On a same-key retry, if the elapsed time
#   since the first attempt exceeds this TTL, the gate HARD_BLOCKs (provider
#   may have purged its deduplication state). Declaring both
#   provider_idempotency_key_param and this TTL also unlocks same-key retry on
#   UNKNOWN while the window is still valid (Reconciler preferred; fail-closed
#   after expiry). Omit to keep today's behaviour (UNKNOWN always hard-blocks).
# Optional host-owned identity: pass request_id=f"charge-order:{order_id}"
#   (server-owned business record, never model output). Retries that reuse it
#   are the same transition. For keyed_mutate, reuse that string as the
#   provider idempotency key when the provider allows it.
# In tool code, wrap the external call in `with side_effect():` so a failure
#   after the call is classified FAILED_AFTER_EFFECT / UNKNOWN (not retried),
#   not FAILED_BEFORE_EFFECT. Inside it call
#   `record_external_operation(provider_id_or_idempotency_key)` so an ambiguous
#   transition can later be reconciled against the provider.
# LangGraph: install `mycelium-runtime[langgraph]`, then enable the optional
#   integration below. command mode or `@config.apply` adds ToolRuntime metadata
#   and maps tool_call_id / thread_id / run_id / node into transition identity.
#   `completion:` also auto-protects LangGraph END (no complete_run() call).
# To reconcile automatically instead of hard-blocking, pass a read-only
#   Reconciler in code: `@ledger_sync(reconciler=...)` or
#   `ActionLedger(reconciler=...)`. It returns COMPLETED / NOT_EXECUTED /
#   UNKNOWN and is fail-closed (reconcilers can't be declared in YAML).

config_version: 1

# ---------------------------------------------------------------------------
# profile  (omit for development; production tightens safety policies)
# ---------------------------------------------------------------------------
# profile: production
#   → action_ledger.memory_storage_policy: error
#   → action_ledger.request_identity_policy: require_explicit
#   → loop_guard / scope_guard missing_run_id_policy: error (when enabled)
#   → outcome_emit: required, durable storage, on_failure: error
#   → completion: requires a verified terminal adapter at startup
#   → secret_args.policy: error when secret_args is enabled and
#     consequential tools exist (warn/redact rejected)
#   → entity_guard.missing_policy: error when entity_guard is enabled
#   → destructive_confirm.missing_policy: error when destructive_confirm
#     is enabled; production grant storage must be durable; multi-node
#     requires redis/postgres; irreversible tools must be declared
#   Weaker explicit warn/derived/memory-outcome settings are rejected.
#   unclassified_policy: warn remains an accepted product choice.
# Verify with:
#   mycelium doctor --config mycelium.yaml --strict
#   mycelium verify --config mycelium.yaml --scenario all --strict

# ---------------------------------------------------------------------------
# deployment  (optional hint for mycelium doctor; omit is backward-compatible)
#   topology: single_node | multi_node
#   multi_node fails file/sqlite for shared ActionLedger / outcome_emit.
# ---------------------------------------------------------------------------
# deployment:
#   topology: single_node

# ---------------------------------------------------------------------------
# state_backend  (optional unified atomic state for stateful guards)
#   memory — tests only; file — one node; redis/postgres — multiple workers.
#   Each guard gets its own namespace automatically. New guards enabled later
#   inherit this backend when their section omits storage.
#   Existing guard files: keep their old storage while running
#     mycelium state migrate --plan --config mycelium.yaml
#     mycelium state migrate --apply --config mycelium.yaml
#   Then remove per-guard storage (or set storage: shared) and run Doctor.
# ---------------------------------------------------------------------------
state_backend:
  storage: file
  path: ./mycelium-guard-state.json
  namespace: mycelium
  # storage: redis
  # url_env: MYCELIUM_REDIS_URL
  # storage: postgres
  # dsn_env: MYCELIUM_POSTGRES_DSN

# ---------------------------------------------------------------------------
# verify  (optional isolation permission for mycelium verify)
#   Doctor inspects configuration. Verify runs synthetic failure scenarios
#   against an isolated namespace (mycelium:verify:<uuid>:). It never executes
#   application tools, never calls an LLM, and never contacts a real provider.
#   allow_temporary_schema: postgres only — create a namespaced table instead
#   of inserting prefixed rows into the configured production table. Off by
#   default. Cleanup never uses DROP/TRUNCATE/FLUSHDB.
# ---------------------------------------------------------------------------
# verify:
#   allow_temporary_schema: false
#   # Optional deployment test. Ordinary `mycelium verify --scenario ...`
#   # never runs this. Use only a private Redis/Postgres test backend and a
#   # provider sandbox implementing PUT/GET /operations/{operation_id}.
#   cluster:
#     enabled: false
#     provider:
#       adapter: http_json
#       name: provider-sandbox
#       sandbox: true
#       base_url_env: MYCELIUM_VERIFY_SANDBOX_URL
#       token_env: MYCELIUM_VERIFY_SANDBOX_TOKEN
#       timeout: 5
#     attestation:
#       signing_key_env: MYCELIUM_DEPLOYMENT_ATTESTATION_KEY
#       key_id: ci-key-id

# ---------------------------------------------------------------------------
# integrations (optional framework metadata; core remains framework-agnostic)
# ---------------------------------------------------------------------------
integrations:
  langgraph:
    enabled: false

# ---------------------------------------------------------------------------
# transition
# ---------------------------------------------------------------------------
transition:
  agent_id: "<TODO: your agent id — used in transition keys and receipts>"
  policy_version: "<TODO: policy version string, e.g. 2026.07.1>"
  lease_ttl: 3600
  # lease_renew_interval: 1200   # default = lease_ttl/3; set 0 to disable auto-renew (v1.14.0)
  poll_interval: 0.05
  poll_timeout: 300
  reclaim_requires_death_signal: true   # require mark-dead / grace before reclaim (prod default)
  # presumed_dead_after: 7200             # default = 2 × lease_ttl; grace window for heartbeat
  # left = Mycelium field; right = kwarg name your tools receive (change/drop as needed)
  scope_from:
    thread_id: thread_id    # <TODO: conversation/thread kwarg>
    run_id: run_id          # <TODO: run/invocation kwarg>
    node: node              # <TODO: graph node/step kwarg>

# ---------------------------------------------------------------------------
# action_ledger  (tool-level claim/settle)
# ---------------------------------------------------------------------------
action_ledger:
  storage: sqlite          # <TODO: memory | file | sqlite | redis | postgres>
  path: ./mycelium-ledger.db
  unclassified_policy: strict   # warn (default): one-time warning on failed retry
                                # strict: hard-block unclassified failed retries
  # memory_storage_policy: warn # warn (default) | error — reject memory + mutate
  # request_identity_policy: derived  # derived (dev default) | require_explicit
  on_args_drift: soft           # soft (default) | hard | off — same dispatch
                                # ticket + different args → ToolBoundaryError /
                                # LedgerHardBlockError (identity-conflict gate);
                                # off only permits derived-key argument drift;
                                # explicit request_id conflicts always fail closed
  # table: mycelium_action_ledger
  # url_env: MYCELIUM_REDIS_URL          # redis (multi-worker)
  # dsn_env: MYCELIUM_POSTGRES_DSN       # postgres (multi-worker / audit)
  # <TODO step 1: copy ledgered tool names from tools: keys below>
  tools: []

# ---------------------------------------------------------------------------
# task_ledger  (whole-task claim/settle; omit if unused)
# ---------------------------------------------------------------------------
task_ledger:
  storage: file            # <TODO: memory | file | sqlite | redis | postgres>
  path: ./mycelium-task-ledger.json
  # url_env: MYCELIUM_REDIS_URL
  # dsn_env: MYCELIUM_POSTGRES_DSN
  # <TODO step 1: copy ledgered task names from tasks: keys below>
  tasks: []

# ---------------------------------------------------------------------------
# state_flush  (persist on abort; omit if unused)
# ---------------------------------------------------------------------------
state_flush:
  # storage omitted: inherits state_backend; use shared to make that explicit
  flush_on: [cancel, disconnect, error]   # subset of cancel | disconnect | error
  # flush_on_complete: true

# ---------------------------------------------------------------------------
# audit_receipt  (signed receipts; needs transition.agent_id; omit if unused)
# ---------------------------------------------------------------------------
audit_receipt:
  signing_key_env: MYCELIUM_SIGNING_KEY   # <TODO: set env, or use signing_key:>
  # storage omitted: inherits state_backend; receipts remain independently signed
  auto: true

# ---------------------------------------------------------------------------
# outcome_emit  (opt-in in development; required in profile: production)
#   Emits one flat row per resolution event (gate decision, body start/
#   complete/fail, operator release) — never per poll tick.
#   storage:
#     memory   — development only
#     file     — durable, single-node (not cross-node)
#     postgres — recommended distributed durable backend (url/url_env or dsn/dsn_env)
#     redis    — Redis Streams; production requires persistence: required
#               (AOF or equivalently durable Redis; Mycelium cannot verify it)
#   production rejects a missing section, storage: memory, incomplete backend
#   config, and redis without persistence: required. Backend outages fail closed.
#   on_failure: warn (dev default) | error (production default, fail-closed)
#   long_running_after: seconds; transitions older than this count as
#     "long-running" in the DTTR denominator (default: lease_ttl). The metric:
#     DTTR = silent_duplicates / max(long_running_or_redispatched, 1), target 0.
#   Inspect with: mycelium outcomes dttr
# ---------------------------------------------------------------------------
# outcome_emit:
#   storage: postgres
#   url_env: DATABASE_URL
#   table: mycelium_outcomes
#   on_failure: error
#   # storage: redis
#   # url_env: REDIS_URL
#   # key_prefix: mycelium:outcomes
#   # persistence: required
#   # storage: file
#   # path: ./mycelium-outcomes.jsonl
#   long_running_after: 3600

# ---------------------------------------------------------------------------
# tools  (add real function names; then list ledgered ones in
#         action_ledger.tools — step 1). Keep empty until you add tools so
#         registry.auto does not allowlist placeholder names.
# ---------------------------------------------------------------------------
tools: {}
# One stub per side_effect_class (uncomment + rename):
#   your_read_tool:                 {callable: package.tools:read, side_effect_class: read}
#   your_idempotent_mutate_tool:    {callable: package.tools:update, side_effect_class: idempotent_mutate}
#   your_keyed_mutate_tool:         {callable: package.tools:charge, side_effect_class: keyed_mutate}
#   your_non_idempotent_mutate_tool:{callable: package.tools:send, side_effect_class: non_idempotent_mutate}
#   your_irreversible_tool:         {callable: package.tools:delete, side_effect_class: irreversible}
# Optional per tool: spendability: multi_use|single_use|non_replayable
#   (omit to use class default), protect: {entity_param, ttl}, bounded: {schema: {}}

# ---------------------------------------------------------------------------
# tasks  (omit if unused; then list ledgered names in task_ledger.tasks — step 1)
# ---------------------------------------------------------------------------
tasks: {}
#   your_task_function:
#     ledger: true
#     id_from: [your_business_key]

# ---------------------------------------------------------------------------
# loop_guard  (AF-003 — halt identical actions across new tool_call_ids)
# ---------------------------------------------------------------------------
loop_guard:
  # storage omitted: inherits state_backend
  escalate_after_soft: 1
  missing_run_id_policy: error  # warn (default, skip if no run_id) | error
  # unclassified_policy: warn   # warn (default): missing side_effect_class → read N=5
                                # strict: treat as mutate N=2
  consecutive_soft:
    read: 5
    idempotent_mutate: 3
    keyed_mutate: 2
    non_idempotent_mutate: 2
    irreversible: 2
  # tools: all                  # default: all keys under tools:
  # exclude: [poll_status]      # known pollers
  # Per-tool: tools.my_tool.loop_guard: { consecutive_soft: 20 }  or  false

# ---------------------------------------------------------------------------
# secret_args  (AF-010 — block raw credentials before claim / evidence)
# Omitted = existing behavior. Production + consequential tools require
#   policy: error. Pass secret:// refs; register_secret_resolver in app
#   code (no default env-var resolver). allow_fields weakens protection —
#   scope narrowly by tool (tools.<name>.secret_fields), not globally.
# Fail-closed pre-execution blocking is primary; redaction is
#   defense-in-depth. Mycelium cannot sanitize app/provider logs.
# ---------------------------------------------------------------------------
# secret_args:
#   enabled: true
#   policy: error          # error | redact | warn
#   allow_fields: []
#   allow_tools: []
#   entropy_detection: true
# Per tool: secret_fields: [api_key]  and/or  secret_args: false

# ---------------------------------------------------------------------------
# entity_guard  (unnumbered — destination policy at the tool boundary)
# A write may carry sensitive data only into a host-authorized destination.
# Unknown / missing / malformed / dynamic destination → no execution.
# The model cannot add recipients to the allowlist.
# ---------------------------------------------------------------------------
# entity_guard:
#   enabled: true
#   missing_policy: error
#   tools:
#     send_email:
#       destinations:
#         - path: recipient
#           type: email
#           allow:
#             addresses: [billing@customer.com]
#             domains: [customer.com]
#         - path: cc
#           type: email
#           allow: []
#           required: false
#     http_post:
#       destinations:
#         - path: url
#           type: https_url
#           allow:
#             hosts: [api.stripe.com, hooks.slack.com]
#           reject_redirects: true
# Per tool: entity_guard: false

# ---------------------------------------------------------------------------
# destructive_confirm  (AF-011 — object grant at the tool boundary)
# Tool permission is not object authorization. A listed destructive tool
# may execute only with a host-issued grant for this exact operation on
# this exact canonical object. The model cannot mint grants. Enforce
# two-person approval before issue_destructive_grant in the host workflow,
# or use DualControlOperatorAuthorizer for operator release. A grant authorizes an attempt, not the
# provider's final outcome. For keyed_mutate, reuse the same request_id
# as the provider idempotency key when the tool declares a mapping.
# ---------------------------------------------------------------------------
# destructive_confirm:
#   enabled: true
#   missing_policy: error
#   # storage: memory   # dev/test only; production rejects memory
#   # path: ./mycelium-destructive-grants.json
#   tools:
#     refund_payment:
#       operation: refund
#       object:
#         type: payment
#         id_from: payment_id
#       grant:
#         bind_request_id: true
#         max_uses: 1
#         ttl_seconds: 300
#     delete_file:
#       operation: delete
#       object:
#         type: file
#         id_from: file_id
#       grant:
#         bind_request_id: true
#         max_uses: 1
#         ttl_seconds: 120
# Per tool: destructive_confirm: false

# ---------------------------------------------------------------------------
# authority_window  (use-time expiry for time-bounded authority)
# Authorization earlier in the run is not enough. Consequential tools with
# time-bounded authority re-check immediately before mark_maybe_crossed /
# provider / body side effect. now >= expires_at hard-blocks. Skew only
# narrows validity. Does not complete use-time currency (item 5).
# ---------------------------------------------------------------------------
# authority_window:
#   enabled: true
#   use_time_check: required
#   clock_skew_tolerance_seconds: 0

# ---------------------------------------------------------------------------
# use_time_currency  (AF-012 — revalidate decide-time facts at use)
# Decide-time truth is not execute-time authority. Declared facts are bound
# at authorize and revalidated immediately before mark_maybe_crossed /
# provider / body. age >= max_age_seconds is stale. Host validators only —
# no prompt scanning. Omitted config keeps existing behavior. Production
# requires missing_policy: error. Pairs with authority_window (item 4).
# ---------------------------------------------------------------------------
# use_time_currency:
#   enabled: true
#   missing_policy: error
#   tools:
#     refund_payment:
#       facts:
#         - name: payment.refundable
#           subject:
#             type: payment
#             id_from: payment_id
#           validator: payment_state
#           require: {value: true}
#           revision_from: payment_version
#           max_age_seconds: 30
#           bind_request_id: true

# ---------------------------------------------------------------------------
# budget  (unnumbered — cost / time / step ceilings; refuse next step)
# LangGraph/LangChain LLM turns are wired automatically from YAML.
# Storage: memory | file | sqlite | redis | postgres (atomic update()).
# missing_usage_policy: warn (default) | error (required in production
#   when max_tokens / max_usd are set). Step/time-only budgets need no
#   token metadata. max_usd needs register_llm_cost_resolver in production.
# max_steps counts every budget-guarded tool call and instrumented LLM turn,
# not business outcomes. Calibrate for worst-case success, failure/retry, and
# cleanup paths; enforce candidate/attempt/success limits separately.
# ---------------------------------------------------------------------------
# budget:
#   storage: file
#   path: ./mycelium-budget.json
#   max_duration: 15m
#   max_steps: 30
#   max_tokens: 100000
#   max_cost_usd: 10
#   missing_usage_policy: error
#   warn_at: 0.8
#   on_missing_meter: hard

# ---------------------------------------------------------------------------
# completion  (AF-007 — refuse terminal while required subtasks are pending)
# Opt-in. Host-declared checklist only — supported frameworks (LangGraph
# END) are wired automatically. Mark success|failed|abandoned; unmarked
# required → refuse; unmarked optional → warn and allow. Vocabulary: allow /
# allow_with_warnings / refuse (not soft/hard).
# profile: production verifies an explicitly selected adapter
# (integrations.langgraph.enabled or register_terminal_adapter). Having
# LangGraph installed is not enough. Custom runtimes launched with
# `mycelium run` should declare an idempotent adapter installer below. The
# installer wires the final-message boundary and calls
# register_terminal_adapter("custom").
# ---------------------------------------------------------------------------
# completion:
#   # storage omitted: inherits state_backend
#   # adapter_installer: my_app.mycelium_completion:install
#   required:
#     - id: charge_customer
#     - id: send_receipt
#   optional:
#     - id: post_slack

# ---------------------------------------------------------------------------
# scope_guard  (AF-008 — freeze run tool allowlist; block mid-run widen)
# Opt-in. Snapshots which tools this run may call (from registry.allowed /
# registry.auto / tools: by default). Re-checks every step so handoffs cannot
# silently add tools. Entity/path/output stay on bounded: — this is allowlist
# only. Wrapper: @scope_guard → @loop_guard → @ledger → @bounded → @protect.
# ---------------------------------------------------------------------------
# scope_guard:
#   # storage omitted: inherits state_backend
#   # missing_run_id_policy: error   # warn (default, skip if no run_id) | error
#   # allowed_tools: from_registry   # default; or all | [tool_a, tool_b]
#   # on_violation: soft             # soft (ToolBoundaryError) | hard
#   # tools: all
#   # exclude: []
#   # Per-tool: tools.my_tool.scope_guard: false

# ---------------------------------------------------------------------------
# state_authority  (refuse tools derived from a superseded state_ref)
# Opt-in. Claim ≠ state authority: the ledger answers "has this run?"; this
# gate answers "is the decision still current?" Host freezes state_ref at
# decide time and passes it on each tool call; canonical_callable returns the
# current checkpoint / state version for compare-at-execute.
# ---------------------------------------------------------------------------
# state_authority:
#   canonical_callable: your_package.state:get_canonical_state_ref
#   require_state_ref: true      # missing state_ref → block
#   on_mismatch: hard            # soft | hard
#   on_missing: hard             # soft | hard
#   # tools: all
#   # exclude: [poll_status]
#   # Per-tool: tools.my_tool.state_authority: false

# ---------------------------------------------------------------------------
# registry / runner / history_guard / message_validator  (omit if unused)
# ---------------------------------------------------------------------------
registry:
  auto: true               # allowlist = keys under tools: (empty until you add tools)
  # or: auto: false + allowed: [tool_a, tool_b]

runner:
  max_llm_retries: 2
  max_tool_retries: 3

history_guard:
  max_tokens: 100000
  max_messages: 1000

message_validator:
  enabled: true
